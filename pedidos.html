  <div class="modal fade" id="editarPedidoModal" tabindex="-1" aria-labelledby="editarPedidoTitulo" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title fs-4" id="editarPedidoTitulo">Editar pedido</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <form id="formEditarPedido">
          <div class="modal-body">
            <input type="hidden" id="pedidoId">
            <input type="hidden" id="pedidoEstado">
            <div class="row g-3">
              <div class="col-md-8">
                <label for="pedidoPlatillo" class="form-label">Platillo</label>

                  <option value="Bruschetta">Bruschetta</option>

              </div>
              <div class="col-md-4">

                  <option value="12500">$12.500</option>
                  <option value="17000">$17.000</option>
                  <option value="16500">$16.500</option>
                  <option value="20000">$20.000</option>
                  <option value="21500">$21.500</option>
                  <option value="13500">$13.500</option>
                  <option value="14500">$14.500</option>
                  <option value="11000">$11.000</option>
                  <option value="25500">$25.500</option>
                  <option value="5500">$5.500</option>
                  <option value="8500">$8.500</option>
                  <option value="9500">$9.500</option>
                  <option value="7500">$7.500</option>
                </select>
              </div>
              <div class="col-md-4">
                <label for="pedidoMesa" class="form-label">Mesa</label>
                <select class="form-select" id="pedidoMesa" required>
                  <option value="1">Mesa 1</option>
                  <option value="2">Mesa 2</option>
                  <option value="3">Mesa 3</option>
                  <option value="4">Mesa 4</option>
                  <option value="5">Mesa 5</option>
                  <option value="6">Mesa 6</option>
                  <option value="7">Mesa 7</option>
                  <option value="8">Mesa 8</option>
                  <option value="9">Mesa 9</option>
                  <option value="10">Mesa 10</option>
                </select>
              </div>
              <div class="col-md-4">
                <label for="pedidoCantidad" class="form-label">Cantidad</label>
                <select class="form-select" id="pedidoCantidad" required>
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                  <option value="5">5</option>
                  <option value="6">6</option>
                  <option value="7">7</option>
                  <option value="8">8</option>
                  <option value="9">9</option>
                  <option value="10">10</option>
                </select>
              </div>
              <div class="col-md-4">
               <label for="pedidoFecha" class="form-label">Fecha</label>
               <input type="datetime-local" class="form-control" id="pedidoFecha" required>
                </select>
              </div>
              <div class="col-md-6">

             <input type="text" class="form-control" id="pedidoCliente"
             placeholder="Nombre del cliente" required>

              <div class="col-12">

              placeholder="Escriba las observaciones">
              </div>

          </div>

  <script>
  // Tabbed Menu
function openMenu(evt, menuName) {
    var i, x, tablinks;

    x = document.getElementsByClassName("menu");

    for (i = 0; i < x.length; i++) {
        x[i].style.display = "none";
    }

    tablinks = document.getElementsByClassName("tablink");

    for (i = 0; i < tablinks.length; i++) {
        tablinks[i].className = tablinks[i].className.replace(" w3-red", "");
    }

    document.getElementById(menuName).style.display = "block";

    evt.currentTarget.firstElementChild.className += " w3-red";
}

document.getElementById("myLink").click();
  </script>
